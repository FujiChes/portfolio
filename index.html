<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chester Besin | Home</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        *{
            font-family: 'Inter', sans-serif;
        }

        body{
            background: #0a0a0a;
            overflow-x: hidden;
        }

        .font-heading{
            font-family: 'Space Grotesk', sans-serif;
        }

        /* HERO BACKGROUND & GLOW EFFECTS */
        .hero-bg {
            position: relative;
            overflow: hidden;
        }

        .grid-bg{
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
            z-index: 1;
        }

        .yellow-glow{
            position: absolute;
            width: 450px;
            height: 450px;
            background: rgba(250,204,21,0.10);
            border-radius: 999px;
            filter: blur(120px);
            top: -120px;
            right: -120px;
            z-index: 1;
        }

        /* FLOATING BACKGROUND ICONS */
        .floating-icon{
            position: absolute;
            color: rgba(250,204,21,0.05);
            font-size: 2rem;
            z-index: 1;
            animation: float 5s ease-in-out infinite;
        }
        .floating-icon:nth-child(1){ top: 15%; left: 10%; }
        .floating-icon:nth-child(2){ top: 75%; left: 15%; animation-delay: 1s; }
        .floating-icon:nth-child(3){ top: 20%; right: 15%; animation-delay: 2s; }
        .floating-icon:nth-child(4){ bottom: 15%; right: 20%; animation-delay: 3s; }

        @keyframes float{
            0%,100%{ transform: translateY(0px); }
            50%{ transform: translateY(-15px); }
        }

        /* Initial state for entrance animation sequence */
        .hero-text > *, .profile-wrapper {
            opacity: 0;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row bg-[#0a0a0a]">

    <nav class="sidebar fixed bottom-0 left-0 w-full h-16 md:h-screen md:w-20 md:top-0 border-t md:border-r md:border-t-0 border-white/10 bg-[#050505] flex md:flex-col items-center z-50 transition-all duration-300 hover:md:w-64">
        <div class="hidden md:block px-6 my-10 text-yellow-400 font-black text-3xl">CB</div>
        
        <div class="flex md:flex-col justify-around md:justify-start space-y-0 md:space-y-4 w-full px-2">
            
            <a href="index.html" class="nav-btn text-yellow-400 bg-white/5 flex items-center gap-4 p-3 rounded-xl w-full">
                <i class="fa-solid fa-house min-w-[20px] text-center"></i>
                <span class="sidebar-text opacity-0 transition-opacity duration-300 font-medium">Home</span>
            </a>
            
            <a href="about.html" class="nav-btn text-gray-500 hover:text-yellow-400 flex items-center gap-4 p-3 rounded-xl w-full transition-colors duration-200">
                <i class="fa-solid fa-user min-w-[20px] text-center"></i>
                <span class="sidebar-text opacity-0 transition-opacity duration-300 font-medium">About</span>
            </a>
            
            <a href="stack.html" class="nav-btn text-gray-500 hover:text-yellow-400 flex items-center gap-4 p-3 rounded-xl w-full transition-colors duration-200">
                <i class="fa-solid fa-code min-w-[20px] text-center"></i>
                <span class="sidebar-text opacity-0 transition-opacity duration-300 font-medium">Tech Stack</span>
            </a>
            
            <a href="certificates.html" class="nav-btn text-gray-500 hover:text-yellow-400 flex items-center gap-4 p-3 rounded-xl w-full transition-colors duration-200">
                <i class="fa-solid fa-certificate min-w-[20px] text-center"></i>
                <span class="sidebar-text opacity-0 transition-opacity duration-300 font-medium">Certificates</span>
            </a>
        </div>
    </nav>

    <main id="content-area" class="w-full md:ml-20 min-h-screen">
        <section class="hero-bg min-h-screen flex items-center px-6 md:px-20 w-full pb-24 md:pb-0">
            
            <div class="grid-bg"></div>
            <div class="yellow-glow"></div>

            <i class="floating-icon fa-solid fa-code"></i>
            <i class="floating-icon fa-solid fa-database"></i>
            <i class="floating-icon fa-solid fa-laptop-code"></i>
            <i class="floating-icon fa-solid fa-terminal"></i>

            <div class="relative z-10 flex flex-col lg:flex-row items-center gap-16 w-full py-12 lg:py-0">
                
                <div class="profile-wrapper relative">
                    <img src="Images/profile4.jpg" alt="Chester" class="w-52 h-52 md:w-72 md:h-72 rounded-full border-4 border-yellow-400 object-cover shadow-2xl shadow-yellow-400/10" />
                </div>

                <div class="hero-text max-w-3xl text-center lg:text-left">
                    <p class="text-yellow-400 uppercase tracking-[0.35em] text-xs mb-5 font-bold">WELCOME TO MY PORTFOLIO</p>
                    <h2 class="text-3xl md:text-4xl text-gray-300 mb-5 font-light">Hi, I am</h2>
                    <h1 class="font-heading text-6xl md:text-[90px] font-black leading-none text-white mb-8">CHESTER <br class="hidden lg:block"><span class="text-yellow-400">BESIN</span></h1>
                    <p class="text-gray-300 text-lg md:text-xl leading-relaxed max-w-2xl mb-10 mx-auto lg:mx-0">passionate about frontend development, UI/UX design, modern web experiences, and creating visually engaging digital projects.</p>

                    <div class="flex flex-wrap justify-center lg:justify-start gap-5 mb-12">
                        <div class="bg-white/[0.04] border border-white/10 rounded-2xl px-6 py-4 min-w-[140px]">
                            <h3 class="text-yellow-400 text-2xl font-black">2+</h3>
                            <p class="text-gray-400 text-sm">Certificates</p>
                        </div>
                        <div class="bg-white/[0.04] border border-white/10 rounded-2xl px-6 py-4 min-w-[140px]">
                            <h3 class="text-yellow-400 text-2xl font-black">UI/UX</h3>
                            <p class="text-gray-400 text-sm">Design Focus</p>
                        </div>
                    </div>

                    <div class="flex flex-wrap justify-center lg:justify-start gap-5">
                        <a href="about.html" class="px-8 py-4 bg-yellow-400 text-black hover:bg-yellow-300 transition duration-300 uppercase tracking-[0.2em] text-xs rounded-xl font-bold inline-block">Read About Me</a>
                        <a href="stack.html" class="px-8 py-4 border border-white/10 text-white hover:border-yellow-400 hover:text-yellow-400 transition duration-300 uppercase tracking-[0.2em] text-xs rounded-xl inline-block">View Tech Stack</a>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script>
        // Profile Image Zoom and Fade Entrance
        anime({
            targets: '.profile-wrapper',
            opacity: [0,1],
            scale: [0.8,1],
            duration: 1400,
            easing: 'easeOutExpo'
        });

        // Cascading Staggered Text Transition Sequence
        anime({
            targets: '.hero-text > *',
            opacity: [0,1],
            translateY: [40,0],
            delay: anime.stagger(140,{start:300}),
            duration: 1200,
            easing: 'easeOutExpo'
        });
    </script>
</body>
</html>
