<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chester Besin | Tech Stack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-[#0a0a0a]">

    <section class="section-fade min-h-screen flex items-center px-6 md:px-20 bg-[#0b0b0b] py-20">
        <div class="w-full">
            <h2 class="text-yellow-400 mb-6 uppercase tracking-widest text-sm">Tech Stack</h2>
            <h1 class="text-4xl md:text-6xl font-heading font-black mb-16 text-white">Languages & Tools</h1>
            
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8">

                <!-- HTML -->
                <div class="stack-item">
                    <i class="fa-brands fa-html5 text-orange-500 text-3xl mb-3"></i>
                    <p class="text-white font-bold">HTML</p>
                </div>

                <!-- CSS -->
                <div class="stack-item">
                    <i class="fa-brands fa-css3-alt text-blue-500 text-3xl mb-3"></i>
                    <p class="text-white font-bold">CSS</p>
                </div>

                <!-- JavaScript -->
                <div class="stack-item">
                    <i class="fa-brands fa-js text-yellow-400 text-3xl mb-3"></i>
                    <p class="text-white font-bold">JavaScript</p>
                </div>

                <!-- Java -->
                <div class="stack-item">
                    <i class="fa-brands fa-java text-red-500 text-3xl mb-3"></i>
                    <p class="text-white font-bold">Java</p>
                </div>

                <!-- MySQL -->
                <div class="stack-item">
                    <i class="fa-solid fa-database text-blue-400 text-3xl mb-3"></i>
                    <p class="text-white font-bold">MySQL</p>
                </div>

                <!-- Tailwind -->
                <div class="stack-item">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tailwindcss/tailwindcss-original.svg" class="w-8 h-8 mb-3" alt="Tailwind">
                    <p class="text-white font-bold">Tailwind</p>
                </div>

                <!-- Figma -->
                <div class="stack-item">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/figma/figma-original.svg" class="w-8 h-8 mb-3" alt="Figma">
                    <p class="text-white font-bold">Figma</p>
                </div>

                <!-- VS Code -->
                <div class="stack-item">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/vscode/vscode-original.svg" class="w-8 h-8 mb-3" alt="VS Code">
                    <p class="text-white font-bold">VS Code</p>
                </div>

                <!-- Git -->
                <div class="stack-item">
                    <i class="fa-brands fa-git-alt text-orange-600 text-3xl mb-3"></i>
                    <p class="text-white font-bold">Git</p>
                </div>

                <!-- GitHub -->
                <div class="stack-item">
                    <i class="fa-brands fa-github text-white text-3xl mb-3"></i>
                    <p class="text-white font-bold">GitHub</p>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
