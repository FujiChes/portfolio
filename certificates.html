<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chester Besin | Certificates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-[#0a0a0a]">

    <section id="certificates" class="section-fade min-h-screen flex items-center px-6 md:px-20 bg-[#0a0a0a] py-20">
        <div class="w-full">
            <h2 class="text-yellow-400 mb-6 uppercase tracking-[0.2em] text-sm font-bold">
                Achievements
            </h2>

            <h1 class="text-4xl md:text-6xl font-heading font-black mb-6 text-white">
                My Certifications
            </h1>

            <p class="text-gray-500 text-lg mb-16 max-w-xl">
                I'm currently focused on building real-world skills and hands-on experience. Certifications are on the horizon — stay tuned.
            </p>

            <!-- Empty State -->
            <div class="flex flex-col items-center justify-center py-24 border border-dashed border-white/10 rounded-2xl bg-white/[0.02]">
                <div class="w-16 h-16 rounded-2xl bg-yellow-400/10 flex items-center justify-center mb-6">
                    <i class="fa-solid fa-certificate text-yellow-400 text-2xl"></i>
                </div>
                <h3 class="text-white font-bold text-xl mb-2">No Certificates Yet</h3>
                <p class="text-gray-600 text-sm text-center max-w-sm">
                    Currently leveling up through projects and coursework. Certifications will be displayed here once earned.
                </p>
            </div>

        </div>
    </section>

</body>
</html>
